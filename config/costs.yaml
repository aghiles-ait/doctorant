version: "1.0"

# Suivi des coûts (sprint 4) : `research-lab costs sync` lit les transcriptions de Claude Code
# (consommation de jetons de chaque réponse du modèle) et les enregistre dans la base ; `costs report`
# les rapporte par projet, agent, état du workflow et modèle.

# Dossier des transcriptions. Vide : celui de Claude Code pour ce dépôt,
# ~/.claude/projects/<chemin du dépôt, caractères non alphanumériques remplacés par « - »>.
transcripts_dir: ""

# Seuls les agents de recherche sont attribués à un projet ; les autres sessions (développement du
# laboratoire) sont comptées à part, sans projet.
research_agents: [doctorant, scientific-reviewer]

# Prix API en dollars par million de jetons (tarifs Anthropic au 2026-10-06, référence claude-api).
# Écriture en cache : 1,25 × le prix d'entrée (5 min), 2 × (1 h). Avec un abonnement Claude, le coût
# calculé est un équivalent API, pas une facture.
prices:
  claude-opus-5-5:   {input: 4.00,  output: 20.00, cache_write_5m: 5.00,  cache_write_1h: 8.00,  cache_read: 0.20}
  claude-sonnet-5-5: {input: 2.00,  output: 10.00, cache_write_5m: 2.50,  cache_write_1h: 4.00,  cache_read: 0.20}
  claude-haiku-5-5:  {input: 0.10,  output: 0.50,  cache_write_5m: 0.125, cache_write_1h: 0.20,  cache_read: 0.01}
  claude-fable-5-1:  {input: 10.00, output: 50.00, cache_write_5m: 12.50, cache_write_1h: 20.00, cache_read: 0.25}
